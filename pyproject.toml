[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myanc-team-brain"
version = "0.1.0"
description = "Host-controlled, source-grounded Feishu team knowledge"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
team-brain-host = "team_brain.host:main"
team-brain-tool = "team_brain.tool:main"

[tool.setuptools.packages.find]
include = ["team_brain*"]
